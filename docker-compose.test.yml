services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: cosolvent
    ports:
      - "5439:5432" # Shifted port to 5439 to avoid conflict with other postgres containers over local :5432
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_test:
