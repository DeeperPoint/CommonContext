[pytest]
# Asyncio tests use the function-scoped event loop automatically.
asyncio_mode = auto

# Keep the heavy DB test opt-in: `pytest -m "not integration"` for fast unit runs,
# `pytest -m integration` to exercise the Dockerized pgvector stack.
markers =
    integration: requires a live Postgres/pgvector container (Docker)

testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
